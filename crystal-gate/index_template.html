<title>南譙樓水晶點雲</title>
<style>
  :root{
    --ink:#04060a;
    --mist:#e8eef5;
    --dim:#77839a;
    --beam:#7fd4ff;
    --brass:#c9a86a;
    --seal:#a33c2b;
    --glass:rgba(10,15,24,.58);
    --hair:rgba(220,235,255,.10);
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:var(--mist); overflow:hidden;
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
  }
  body.mode-crystal{
    background:radial-gradient(1100px 720px at 50% 36%, #0c1626 0%, #060a12 55%, #020308 100%);
  }
  #gl,#fx{position:fixed; inset:0; width:100%; height:100%; display:block}
  #fx{pointer-events:none}
  .ui{position:fixed; z-index:5}

  /* ── identity ─────────────────────────── */
  #brand{top:22px; left:22px; display:flex; gap:14px; align-items:flex-start; pointer-events:none}
  #brand .plaque{
    writing-mode:vertical-rl; text-orientation:upright;
    font-family:'Noto Serif TC','Songti TC','PMingLiU',serif; font-weight:900;
    font-size:30px; letter-spacing:.34em; color:var(--brass);
    text-shadow:0 0 22px rgba(201,168,106,.25); line-height:1.2;
  }
  #brand .seal{width:11px; height:11px; background:var(--seal); margin-top:10px;
    box-shadow:0 0 10px rgba(163,60,43,.5)}
  #brand .side{display:flex; flex-direction:column; gap:7px; padding-top:2px}
  #brand .sub{
    font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px; letter-spacing:.32em; color:var(--dim); text-transform:uppercase;
  }
  #brand .scene-name{
    font-family:'Noto Serif TC','Songti TC',serif; font-weight:700;
    font-size:15px; letter-spacing:.2em; color:var(--brass); opacity:.92;
  }

  /* ── HUD ──────────────────────────────── */
  #hud{top:22px; right:22px; text-align:right; pointer-events:none;
    font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    font-size:10px; line-height:1.8; letter-spacing:.14em; color:rgba(158,205,240,.78);
  }
  #hud .live{display:inline-block; width:6px; height:6px; background:var(--beam);
    margin-left:7px; animation:blink 1.6s steps(2) infinite;
    box-shadow:0 0 8px var(--beam)}
  @keyframes blink{50%{opacity:.15}}

  /* ── control deck ─────────────────────── */
  #deck{
    left:50%; bottom:26px; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:center;
    max-width:min(94vw,860px); padding:10px 16px;
    background:var(--glass); border:1px solid var(--hair); border-radius:14px;
    backdrop-filter:blur(12px) saturate(1.25); -webkit-backdrop-filter:blur(12px) saturate(1.25);
  }
  .grp{display:flex; align-items:center; gap:8px}
  .grp .lb{
    font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-size:9px;
    letter-spacing:.28em; color:var(--dim); margin-right:2px;
  }
  .vr{width:1px; height:26px; background:var(--hair)}

  .thumb{width:46px; height:34px; padding:0; border-radius:6px; overflow:hidden;
    border:1px solid var(--hair); background:#000; cursor:pointer; position:relative;
    transition:border-color .2s, box-shadow .2s; flex:none}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; opacity:.55;
    filter:saturate(.4) brightness(.9); transition:opacity .2s, filter .2s}
  .thumb.on{border-color:var(--brass); box-shadow:0 0 12px rgba(201,168,106,.28)}
  .thumb.on img{opacity:1; filter:saturate(.85)}

  .btn{
    appearance:none; background:transparent; border:1px solid transparent; color:var(--dim);
    font-family:inherit; font-size:12.5px; letter-spacing:.14em; padding:6px 10px;
    border-radius:8px; cursor:pointer; transition:color .2s, border-color .2s, background .2s;
  }
  .btn:hover{color:var(--mist)}
  .btn.on{color:var(--beam); border-color:rgba(127,212,255,.4); background:rgba(127,212,255,.07)}
  .btn:focus-visible,.thumb:focus-visible,.chip:focus-visible{outline:1px solid var(--beam); outline-offset:2px}

  .chip{width:20px; height:20px; border-radius:50%; border:1px solid var(--hair);
    padding:0; cursor:pointer; flex:none; transition:box-shadow .2s, border-color .2s}
  .chip.on{border-color:var(--beam); box-shadow:0 0 10px rgba(127,212,255,.45)}
  .chip.c-laser{background:radial-gradient(circle at 40% 35%, #fff, #b9c6d6 70%)}
  .chip.c-ice{background:radial-gradient(circle at 40% 35%, #cfeeff, #4fa8d8 75%)}
  .chip.c-rgb{background:conic-gradient(#e66,#dc5 25%,#5c8 50%,#59c 75%,#e66)}

  #hint{
    left:50%; bottom:6px; transform:translateX(-50%); pointer-events:none;
    font-size:10.5px; letter-spacing:.18em; color:rgba(150,165,190,.42); white-space:nowrap;
  }
  #ticks{
    left:0; right:0; bottom:88px; text-align:center; pointer-events:none;
    font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-size:8.5px;
    letter-spacing:.35em; color:rgba(190,215,245,.20); white-space:nowrap; overflow:hidden;
  }

  /* ── veils ────────────────────────────── */
  #sculpt{position:fixed; inset:0; z-index:7; background:var(--ink); display:flex;
    flex-direction:column; touch-action:none}
  #sculpt[hidden]{display:none}
  #scTop{display:flex; align-items:center; gap:12px; padding:12px 16px; flex:none}
  #scTop .ttl{font-family:'Noto Serif TC','Songti TC',serif; font-weight:700; font-size:16px;
    letter-spacing:.24em; color:var(--brass)}
  #scTop .sp{flex:1}
  #scTop .hint2{font-size:10px; letter-spacing:.12em; color:var(--dim)}
  #scv{flex:1; min-height:0; display:block; width:100%; cursor:crosshair}
  #scDeck{flex:none; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    justify-content:center; padding:10px 12px 14px;
    background:var(--glass); border-top:1px solid var(--hair);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
  #scDeck input[type=range]{width:86px; accent-color:var(--beam)}
  #scDeck .rl{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-size:9px;
    letter-spacing:.2em; color:var(--dim)}
  #scBack{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:7;
    background:var(--glass); border:1px solid rgba(127,212,255,.4); color:var(--beam);
    border-radius:20px; padding:9px 20px; font-size:13px; letter-spacing:.2em; cursor:pointer;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
  #scBack[hidden]{display:none}
  #toast{position:fixed; left:50%; top:20px; transform:translateX(-50%); z-index:11;
    background:rgba(12,20,34,.9); border:1px solid var(--hair); color:var(--mist);
    padding:9px 18px; border-radius:10px; font-size:12.5px; letter-spacing:.08em;
    opacity:0; transition:opacity .3s; pointer-events:none; max-width:86vw; text-align:center}
  #toast.on{opacity:1}
  @media (max-width:640px){ #scTop{padding:10px 12px} #scTop .hint2{display:none} }
  #veil{position:fixed; inset:0; background:#010205; opacity:0; pointer-events:none;
    transition:opacity .32s ease; z-index:8}
  #veil.on{opacity:1}
  #load{position:fixed; inset:0; background:var(--ink); z-index:9;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .7s ease}
  #load.off{opacity:0; pointer-events:none}
  #load .seal{width:13px; height:13px; background:var(--seal); box-shadow:0 0 12px rgba(163,60,43,.55)}
  #load h1{margin:0; font-family:'Noto Serif TC','Songti TC',serif; font-weight:900;
    font-size:clamp(34px,6vw,52px); letter-spacing:.42em; text-indent:.42em; color:var(--brass);
    text-shadow:0 0 30px rgba(201,168,106,.3)}
  #load .st{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-size:10px;
    letter-spacing:.3em; color:var(--dim)}
  #load .bar{width:180px; height:1px; background:rgba(255,255,255,.10); overflow:hidden}
  #load .bar i{display:block; height:100%; width:30%; background:var(--beam);
    box-shadow:0 0 8px var(--beam); animation:sweep 1.1s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(640%)}}

  #err{position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    background:var(--ink); color:var(--dim); font-size:14px; letter-spacing:.1em; text-align:center; padding:30px}

  @media (max-width:640px){
    #brand{top:14px; left:14px}
    #brand .plaque{font-size:22px}
    #hud{display:none}
    #ticks{display:none}
    #deck{bottom:14px; gap:10px; padding:8px 10px; border-radius:12px}
    #hint{display:none}
    .vr{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #hud .live{animation:none}
    #load .bar i{animation:none; width:100%}
  }
  body.rec .ui, body.rec #hint, body.rec #load{display:none!important}
</style>

<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="ticks" class="ui"></div>

<header id="brand" class="ui">
  <div class="plaque">南譙樓</div>
  <div class="seal"></div>
  <div class="side">
    <div class="sub">LASER·POINT·CLOUD</div>
    <div class="scene-name" id="sceneName">正面全景</div>
  </div>
</header>

<div id="hud" class="ui">
  <div id="hudPts">PTS —</div>
  <div id="hudMode">MODE SCAN·DRIFT</div>
  <div><span id="hudSrc">SRC —</span><span class="live"></span></div>
</div>

<div id="deck" class="ui">
  <div class="grp" id="thumbs"><span class="lb">場景</span></div>
  <div class="vr"></div>
  <div class="grp"><span class="lb">模式</span>
    <button class="btn on" id="mScan">掃描飛行</button>
    <button class="btn" id="mCrystal">水晶方塊</button>
  </div>
  <div class="vr"></div>
  <div class="grp"><span class="lb">光色</span>
    <button class="chip c-laser on" data-c="laser" aria-label="雷射白"></button>
    <button class="chip c-ice" data-c="ice" aria-label="冰藍"></button>
    <button class="chip c-rgb" data-c="rgb" aria-label="原色"></button>
  </div>
  <div class="vr"></div>
  <div class="grp"><button class="btn" id="mSculpt">捏塑</button></div>
  <div class="vr"></div>
  <div class="grp" id="dens"><span class="lb">密度</span>
    <button class="btn" data-d="70000">疏</button>
    <button class="btn on" data-d="150000">中</button>
    <button class="btn" data-d="300000">密</button>
  </div>
</div>
<div id="hint" class="ui">拖曳旋轉 ・ 滾輪／雙指縮放 ・ 雙擊回自動運鏡</div>

<div id="sculpt" hidden>
  <div id="scTop">
    <span class="ttl">捏塑深度</span>
    <span class="hint2">單指塗抹 ・ 雙指移動／縮放</span>
    <span class="sp"></span>
    <button class="btn" id="scUndo">復原</button>
    <button class="btn" id="scPrev">3D 預覽</button>
    <button class="btn on" id="scDone">完成</button>
  </div>
  <canvas id="scv"></canvas>
  <div id="scDeck">
    <div class="grp"><span class="lb">工具</span>
      <button class="btn on" data-t="pull">拉近</button>
      <button class="btn" data-t="push">推遠</button>
      <button class="btn" data-t="smooth">撫平</button>
      <button class="btn" data-t="level">齊平</button>
    </div>
    <div class="grp"><span class="rl">筆刷</span><input type="range" id="scSize" min="14" max="150" value="55"></div>
    <div class="grp"><span class="rl">力道</span><input type="range" id="scStr" min="10" max="100" value="55"></div>
    <div class="grp"><button class="btn on" id="scHeat">深度層</button></div>
    <div class="grp"><button class="btn" id="scReset">還原原稿</button>
      <button class="btn" id="scSave">儲存新版本</button></div>
  </div>
</div>
<button id="scBack" hidden>返回捏塑</button>
<div id="toast"></div>

<div id="veil"></div>
<div id="load">
  <div class="seal"></div>
  <h1>南譙樓</h1>
  <div class="bar"><i></i></div>
  <div class="st" id="loadSt">正在解析點雲資料…</div>
</div>
<div id="err">這個裝置無法啟用 WebGL，點雲無法顯示。請改用支援 WebGL 的瀏覽器。</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--THREE_SRC--><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><!--/THREE_SRC-->
<script>/*__SCENES_DATA__*/</script>
<script>
'use strict';
/* ============================================================
   南譙樓水晶點雲 — photo → depth → laser point cloud
   modes: scan (LiDAR flythrough) / crystal (engraved glass block)
   ============================================================ */
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = new URLSearchParams(location.search);
const REC = Q.get('record') === '1';
if (REC) document.body.classList.add('rec');

const CFG = {
  zNear: 1.0, zFar: 7.0,
  vfovPortrait: 66, vfovLandscape: 48,
  revealDur: RM ? 0.6 : 2.4,
  crystalFlatten: 0.5,       // relief compression inside the glass block
  crystalMax: 1.6,           // block max dimension
  turnSpeed: REC ? 0.55 : 0.28,
};

/* ---------- state ---------- */
const S = {
  mode: 'scan',              // 'scan' | 'crystal'
  colorMode: 'laser',        // 'laser' | 'ice' | 'rgb'
  density: 150000,
  sceneId: null,
  cloud: null,               // {info, geometry}
  revealT0: 0,
  user: { active: false, lastInput: -1e9, th: 0, ph: 0, r: 1, tOfs: new THREE.Vector3() },
  t: 0,
};
const CACHE = {};            // sceneId -> {colorData, depthF, engF, cw, ch, dw, dh}

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: false, alpha: true, powerPreference: 'high-performance' });
} catch (e) { $('#err').style.display = 'flex'; throw e; }
renderer.setClearColor(0x000000, 0);
const scene3 = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, 1, 0.05, 60);
const gScan = new THREE.Group(), gCrystal = new THREE.Group(), gTurn = new THREE.Group();
scene3.add(gScan, gCrystal); gCrystal.add(gTurn);

/* ---------- point shader ---------- */
const TINTS = { laser: [1, 1, 1], ice: [0.62, 0.86, 1.0], rgb: [1, 1, 1] };
function makePointMat(sizeMul, mirror) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uPx: { value: 600 }, uSize: { value: 1 }, uSizeMul: { value: sizeMul },
      uReveal: { value: 0 }, uYMin: { value: 0 }, uYMax: { value: 1 },
      uColorMix: { value: 0 }, uTint: { value: new THREE.Vector3(1, 1, 1) },
      uFogStart: { value: 3.2 }, uFogK: { value: 0.16 },
      uTwk: { value: RM ? 0 : 1 },
      uMirror: { value: mirror ? 1 : 0 }, uPlaneY: { value: 0 }, uGlobalA: { value: 1 }, uGain: { value: 1.35 }, uOrtho: { value: 0 },
    },
    vertexShader: `
      attribute vec3 aCol; attribute vec3 aPos2; attribute float aEng; attribute float aRnd; attribute float aSz;
      uniform float uTime,uPx,uSize,uSizeMul,uReveal,uYMin,uYMax,uTwk,uOrtho;
      varying vec3 vCol; varying float vEng,vRnd,vBand,vDist,vWy,vVis;
      void main(){
        vCol=aCol; vEng=aEng; vRnd=aRnd;
        vec3 pos=mix(position,aPos2,uOrtho);
        float yN=(pos.y-uYMin)/max(uYMax-uYMin,1e-5);
        float edge=(1.04-uReveal*1.08);
        vVis=step(edge,yN+0.0001);
        vBand=(1.0-smoothstep(0.0,0.055,abs(yN-edge)))*(1.0-step(1.0,uReveal));
        vec4 wp=modelMatrix*vec4(pos,1.0); vWy=wp.y;
        vec4 mv=viewMatrix*wp;
        vDist=-mv.z;
        float tw=1.0-uTwk*0.28*(0.5+0.5*sin(uTime*(0.7+aRnd*2.3)+aRnd*43.0));
        gl_PointSize=clamp(uSize*uSizeMul*aSz*tw*uPx/max(vDist,0.05),0.75,6.0);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader: `
            uniform float uTime,uColorMix,uFogStart,uFogK,uTwk,uMirror,uPlaneY,uReveal,uGlobalA,uGain;
      uniform vec3 uTint;
      varying vec3 vCol; varying float vEng,vRnd,vBand,vDist,vWy,vVis;
      void main(){
        if(vVis<0.5) discard;
        vec2 p=gl_PointCoord*2.0-1.0; float r2=dot(p,p);
        if(r2>1.0) discard;
        float disc=smoothstep(1.0,0.18,r2);
        float tw=1.0-uTwk*0.30*(0.5+0.5*sin(uTime*(0.8+vRnd*2.6)+vRnd*61.0));
        vec3 mono=uTint*vEng;
        vec3 col=mix(mono,vCol*(0.35+0.65*vEng),uColorMix);
        float fog=exp(-max(0.0,vDist-uFogStart)*uFogK);
        float a=disc*tw*fog;
        if(uMirror>0.5){ a*=0.22*exp(min(0.0,(vWy-uPlaneY))*2.6); col*=vec3(0.75,0.85,1.0); }
        col=col*uGain+vBand*vec3(0.55,0.85,1.0)*3.0;
        gl_FragColor=vec4(col*a*uGlobalA,1.0);
      }`,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true, transparent: true,
  });
}
const matScan = makePointMat(1, false);
const matCrystal = makePointMat(1, false);
const ALL_MATS = [matScan, matCrystal];

let ptsScan = null, ptsCrystal = null;

/* ---------- crystal furniture (built per scene) ---------- */
let cube = null;  // {front, back, edges, base, glow, floor, dims}
function glassMat(back) {
  return new THREE.ShaderMaterial({
    uniforms: { uA: { value: back ? 0.10 : 1.0 } },
    vertexShader: `varying vec3 vN,vV; void main(){ vN=normalize(normalMatrix*normal);
      vec4 mv=modelViewMatrix*vec4(position,1.0); vV=normalize(-mv.xyz);
      gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `precision mediump float; uniform float uA; varying vec3 vN,vV;
      void main(){ float f=pow(1.0-abs(dot(normalize(vN),normalize(vV))),3.0);
        vec3 col=mix(vec3(0.03,0.05,0.09),vec3(0.55,0.80,1.0),f);
        float a=uA<0.5? 0.05 : (0.04+0.34*f);
        gl_FragColor=vec4(col,a); }`,
    transparent: true, depthWrite: false, side: back ? THREE.BackSide : THREE.FrontSide,
  });
}
function disposeCube() {
  if (!cube) return;
  for (const k of ['front', 'back', 'edges', 'base', 'glow', 'floor']) {
    const o = cube[k]; if (!o) continue;
    o.parent && o.parent.remove(o);
    o.geometry && o.geometry.dispose();
    o.material && o.material.dispose && o.material.dispose();
  }
  cube = null;
}
function buildCube(dims) {
  disposeCube();
  const { w, h, d } = dims;
  const g = new THREE.BoxGeometry(w, h, d);
  const back = new THREE.Mesh(g, glassMat(true)); back.renderOrder = 0;
  const front = new THREE.Mesh(g.clone(), glassMat(false)); front.renderOrder = 4;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g),
    new THREE.LineBasicMaterial({ color: 0xa8d8f8, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending }));
  edges.renderOrder = 3;
  back.position.y = front.position.y = edges.position.y = h / 2 + 0.001;
  gTurn.add(back, front, edges);

  const baseH = 0.16, baseW = w * 1.18, baseD = d * 1.18;
  const base = new THREE.Mesh(new THREE.BoxGeometry(baseW, baseH, baseD),
    new THREE.MeshBasicMaterial({ color: 0x0d1420 }));
  base.position.y = -baseH / 2 - 0.002;
  // LED glow plane on top of the base
  const glowTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(64, 64, 4, 64, 64, 62);
    gr.addColorStop(0, 'rgba(127,212,255,0.85)'); gr.addColorStop(0.5, 'rgba(80,150,220,0.28)');
    gr.addColorStop(1, 'rgba(40,90,160,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
    const t = new THREE.CanvasTexture(c); return t;
  })();
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(baseW * 1.04, baseD * 1.04),
    new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8 }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = 0.004; glow.renderOrder = 1;
  // floor disc
  const floorTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(128, 128, 10, 128, 128, 126);
    gr.addColorStop(0, 'rgba(30,48,74,0.55)'); gr.addColorStop(0.6, 'rgba(12,20,34,0.28)');
    gr.addColorStop(1, 'rgba(4,7,12,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  })();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w * 7, d * 7),

const scv = $('#scv'), scx = scv.getContext('2d');
const heatC = document.createElement('canvas'); heatC.width = heatC.height = 518;
const heatX = heatC.getContext('2d');
const heatID = heatX.createImageData(518, 518);
function sculptData() { return CACHE[S.sceneId]; }
function rebuildHeat() {
  const c = sculptData(); if (!c) return;
  const d = heatID.data, dn = c.depthF, eg = c.engF;
  for (let i = 0; i < dn.length; i++) {
    const t = dn[i];
    d[i * 4] = 30 + 225 * t; d[i * 4 + 1] = 60 + 150 * t; d[i * 4 + 2] = 180 - 90 * t;
    d[i * 4 + 3] = 255 * Math.min(1, 0.16 + 0.7 * Math.min(1, eg[i] * 2.2));
  }
  heatX.putImageData(heatID, 0, 0);
  SCULPT.heatDirty = false;
}
function sculptFit() {
  const c = sculptData(); if (!c) return;
  const r = scv.getBoundingClientRect();
  scv.width = r.width; scv.height = r.height;
  const s0 = Math.min(r.width / c.cw, r.height / c.ch) * 0.96;
  SCULPT.view = { s: s0, tx: (r.width - c.cw * s0) / 2, ty: (r.height - c.ch * s0) / 2 };
}
function sculptDraw() {
  const c = sculptData(); if (!c || !SCULPT.active || SCULPT.preview) return;
  if (SCULPT.heatDirty) rebuildHeat();
  const v = SCULPT.view;
  scx.setTransform(1, 0, 0, 1, 0, 0);
  scx.fillStyle = '#04060a'; scx.fillRect(0, 0, scv.width, scv.height);
  scx.setTransform(v.s, 0, 0, v.s, v.tx, v.ty);
  scx.imageSmoothingEnabled = true;
  scx.drawImage(c.colorImg, 0, 0);
  if (SCULPT.heat) scx.drawImage(heatC, 0, 0, c.cw, c.ch);
  scx.setTransform(1, 0, 0, 1, 0, 0);
  if (SCULPT.cursor) {
    scx.strokeStyle = 'rgba(127,212,255,.85)'; scx.lineWidth = 1.2;
    scx.beginPath();
    scx.arc(SCULPT.cursor.x, SCULPT.cursor.y, SCULPT.size * v.s, 0, Math.PI * 2);
    scx.stroke();
  }
}
function screenToImg(x, y) {
  const v = SCULPT.view;
  return { x: (x - v.tx) / v.s, y: (y - v.ty) / v.s };
}
function brushAt(ix, iy) {
  const c = sculptData(); if (!c) return;
  const dn = c.depthF, dw = c.dw, dh = c.dh;
  const gx = ix / c.cw * dw, gy = iy / c.ch * dh;
  const rg = Math.max(1.5, SCULPT.size / c.cw * dw);
  const sg = rg / 1.8, str = SCULPT.str;
  const x0 = Math.max(0, Math.floor(gx - rg)), x1 = Math.min(dw - 1, Math.ceil(gx + rg));
  const y0 = Math.max(0, Math.floor(gy - rg)), y1 = Math.min(dh - 1, Math.ceil(gy + rg));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const dx = x - gx, dy = y - gy, d2 = dx * dx + dy * dy;
      if (d2 > rg * rg) continue;
      const w = Math.exp(-d2 / (2 * sg * sg));
      const i = y * dw + x;
      if (SCULPT.tool === 'pull') dn[i] += 0.03 * str * w;
      else if (SCULPT.tool === 'push') dn[i] -= 0.03 * str * w;
      else if (SCULPT.tool === 'level') dn[i] += (SCULPT.levelRef - dn[i]) * 0.32 * str * w;
      else {
        const xm = Math.max(1, Math.min(dw - 2, x)), ym = Math.max(1, Math.min(dh - 2, y));
        const m = (dn[ym * dw + xm - 1] + dn[ym * dw + xm + 1] + dn[(ym - 1) * dw + xm] + dn[(ym + 1) * dw + xm]) / 4;
        dn[i] += (m - dn[i]) * 0.5 * str * w;
      }
      if (dn[i] < 0) dn[i] = 0; else if (dn[i] > 1) dn[i] = 1;
    }
  }
  SCULPT.heatDirty = true; SCULPT.dirty3d = true;
}
function sampleDepthAt(ix, iy) {
  const c = sculptData();
  const gx = Math.max(0, Math.min(c.dw - 1, Math.round(ix / c.cw * c.dw)));
  const gy = Math.max(0, Math.min(c.dh - 1, Math.round(iy / c.ch * c.dh)));
  return c.depthF[gy * c.dw + gx];
}
async function sculptRebuild3D() {
  if (!SCULPT.dirty3d) return;
  SCULPT.dirty3d = false;
  await setScene(S.sceneId, { force: true, instant: true });
}
function setSculpt(on) {
  SCULPT.active = on; SCULPT.preview = false;
  $('#sculpt').hidden = !on; $('#scBack').hidden = true;
  document.querySelectorAll('#deck,#brand,#hud,#hint,#ticks').forEach(el => el.style.visibility = on ? 'hidden' : '');
  if (on) {
    requestAnimationFrame(() => { sculptFit(); SCULPT.heatDirty = true; sculptDraw(); });
    toast('用手指或滑鼠直接在畫上推拉深度', 3200);
  } else {
    saveLocal(); sculptRebuild3D();
  }
}
$('#mSculpt').onclick = () => setSculpt(true);
$('#scDone').onclick = () => setSculpt(false);
$('#scPrev').onclick = async () => {
  SCULPT.preview = true; $('#sculpt').hidden = true; $('#scBack').hidden = false;
  await sculptRebuild3D();
};
$('#scBack').onclick = () => {
  SCULPT.preview = false; $('#sculpt').hidden = false; $('#scBack').hidden = true;
  requestAnimationFrame(() => { sculptFit(); sculptDraw(); });
};
document.querySelectorAll('#scDeck [data-t]').forEach(el => el.onclick = () => {
  SCULPT.tool = el.dataset.t;
  document.querySelectorAll('#scDeck [data-t]').forEach(b => b.classList.toggle('on', b === el));
});
$('#scSize').oninput = e => { SCULPT.size = +e.target.value; sculptDraw(); };
$('#scStr').oninput = e => { SCULPT.str = +e.target.value / 100; };
$('#scHeat').onclick = e => { SCULPT.heat = !SCULPT.heat; e.target.classList.toggle('on', SCULPT.heat); sculptDraw(); };
$('#scUndo').onclick = () => {
  const c = sculptData();
  const u = SCULPT.undo.pop();
  if (u && c) { c.depthF.set(u); SCULPT.heatDirty = true; SCULPT.dirty3d = true; sculptDraw(); saveLocal(); }
  else toast('沒有可復原的步驟');
};
$('#scReset').onclick = () => {
  const c = sculptData(); if (!c) return;
  SCULPT.undo.push(c.depthF.slice());
  c.depthF.set(c.depth0); delete OVR[S.sceneId];
  SCULPT.heatDirty = true; SCULPT.dirty3d = true; sculptDraw(); saveLocal();
  toast('已還原為原稿深度');
};
$('#scSave').onclick = async () => {
  const btn = $('#scSave');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    const art = window.claude && (await claude.use('artifact'));
    if (!art) { saveLocal(); toast('雲端儲存不可用，已存在此裝置'); return; }
    const scenes = {};
    for (const id in CACHE) scenes[id] = { d: f32ToB64(CACHE[id].depthF), dv: sceneDv(id) };
    const payload = JSON.stringify({ v: 1, ts: Date.now(), scenes });
    await art.publish({ 'data/sculpt.json': { content: payload, contentType: 'application/json' } });
    saveLocal();
    toast('已儲存！之後打開這頁都是你捏的版本');
  } catch (e) {
    const code = e && e.code;
    if (code === 'conflict') toast('別處剛存了新版本，頁面即將更新');
    else if (code === 'not_writer' || code === 'not_granted') { saveLocal(); toast('此檢視為唯讀，已改存在此裝置'); }
    else if (code === 'rate_limited') toast('儲存太頻繁，請稍後再試');
    else { saveLocal(); toast('暫時無法上傳，已存在此裝置'); }
  } finally {
    btn.disabled = false; btn.textContent = '儲存新版本';
  }
};
const scPtrs = new Map();
let scPinch = null, scLast = null;
scv.addEventListener('pointerdown', e => {
  scv.setPointerCapture(e.pointerId);
  scPtrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (scPtrs.size === 1) {
    const c = sculptData(); if (!c) return;
    SCULPT.undo.push(c.depthF.slice());
    if (SCULPT.undo.length > 15) SCULPT.undo.shift();
    SCULPT.stroking = true;
    const p = screenToImg(e.offsetX, e.offsetY);
    if (SCULPT.tool === 'level') SCULPT.levelRef = sampleDepthAt(p.x, p.y);
    brushAt(p.x, p.y); scLast = p; sculptDraw();
  } else if (scPtrs.size === 2) {
    SCULPT.stroking = false; scLast = null;
    const a = [...scPtrs.values()];
    scPinch = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y),
                cx: (a[0].x + a[1].x) / 2, cy: (a[0].y + a[1].y) / 2,
                v: { ...SCULPT.view } };
  }
});
scv.addEventListener('pointermove', e => {
  SCULPT.cursor = { x: e.offsetX, y: e.offsetY };
  if (scPtrs.has(e.pointerId)) scPtrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (scPtrs.size === 1 && SCULPT.stroking) {
    const p = screenToImg(e.offsetX, e.offsetY);
    if (scLast) {
      const dist = Math.hypot(p.x - scLast.x, p.y - scLast.y);
      const step = Math.max(2, SCULPT.size * 0.3);
      const n = Math.max(1, Math.ceil(dist / step));
      for (let i = 1; i <= n; i++) brushAt(scLast.x + (p.x - scLast.x) * i / n, scLast.y + (p.y - scLast.y) * i / n);
    } else brushAt(p.x, p.y);
    scLast = p;
  } else if (scPtrs.size === 2 && scPinch) {
    const a = [...scPtrs.values()];
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    const cx = (a[0].x + a[1].x) / 2, cy = (a[0].y + a[1].y) / 2;
    const k = Math.max(0.2, Math.min(8, d / Math.max(1, scPinch.d)));
    SCULPT.view.s = scPinch.v.s * k;
    SCULPT.view.tx = cx - (scPinch.cx - scPinch.v.tx) * k;
    SCULPT.view.ty = cy - (scPinch.cy - scPinch.v.ty) * k;
  }
  sculptDraw();
});
function scEnd(e) {
  scPtrs.delete(e.pointerId);
  if (scPtrs.size < 2) scPinch = null;
  if (scPtrs.size === 0 && SCULPT.stroking) {
    SCULPT.stroking = false; scLast = null;
    clearTimeout(scEnd._h); scEnd._h = setTimeout(saveLocal, 800);
  }
  sculptDraw();
}
scv.addEventListener('pointerup', scEnd);
scv.addEventListener('pointercancel', scEnd);
scv.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0012);
  const v = SCULPT.view;
  v.tx = e.offsetX - (e.offsetX - v.tx) * k;
  v.ty = e.offsetY - (e.offsetY - v.ty) * k;
  v.s *= k;
  sculptDraw();
}, { passive: false });
addEventListener('resize', () => { if (SCULPT.active && !SCULPT.preview) { sculptFit(); sculptDraw(); } });

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
let prevT = 0;
function frame(t, dt) {
  S.t = t;
  const rev = Math.min(1, (t - S.revealT0) / CFG.revealDur);
  for (const m of ALL_MATS) { m.uniforms.uTime.value = t; m.uniforms.uReveal.value = rev; }
  if (S.mode === 'crystal') gTurn.rotation.y = RM && !REC ? 0 : Math.sin(t * CFG.turnSpeed) * 0.20;
  updateCamera(t, dt);
  renderer.render(scene3, cam);
  drawFX();
}
function loop() {
  const t = clock.getElapsedTime(); const dt = Math.min(0.1, t - prevT); prevT = t;
  if (!(SCULPT.active && !SCULPT.preview)) frame(t, dt);
  requestAnimationFrame(loop);
}

/* ---------- record hooks ---------- */
window.__ready = false;
window.__setup = async (sceneId, mode, colorMode) => {
  setMode(mode, { instant: true, force: true });
  setColorMode(colorMode || 'laser');
  await setScene(sceneId, { instant: true, force: true });
  S.revealT0 = 0;
  return true;
};
window.__frame = (t) => { const dt = t - prevT; prevT = t; frame(t, Math.max(0.0001, dt)); return true; };

/* ---------- boot ---------- */
(async function boot() {
  try {
    resize();
    $('#loadSt').textContent = '正在解碼影像與深度…';
    const first = Q.get('scene') || SCENES[0].id;
    if (!Q.get('density') && matchMedia('(pointer:coarse)').matches) {
      S.density = 70000;
      document.querySelectorAll('#dens .btn').forEach(b => b.classList.toggle('on', b.dataset.d === '70000'));
    }
    setColorMode('laser');
    setMode(Q.get('mode') === 'crystal' ? 'crystal' : 'scan', { instant: true, force: true });
    if (Q.get('density')) S.density = +Q.get('density');
    $('#loadSt').textContent = '正在重建三維點雲…';
    await loadOverrides();
    await setScene(first, { instant: true });
    updateTicks();
    $('#load').classList.add('off');
    S.revealT0 = 0.001; clock.start(); prevT = 0;
    window.__ready = true;
    if (!REC) loop(); else frame(0.0001, 0.0001);
  } catch (e) {
    $('#loadSt').textContent = '載入失敗：' + e.message;
    console.error(e);
  }
})();
</script>
